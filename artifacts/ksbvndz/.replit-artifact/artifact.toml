kind = "web"
previewPath = "/"
title = "KsBvndz"
version = "1.0.0"
id = "artifacts/ksbvndz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21981

[services.development]
run = "pnpm --filter @workspace/ksbvndz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ksbvndz", "run", "build" ]
serve = "static"
publicDir = "artifacts/ksbvndz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21981"
BASE_PATH = "/"
